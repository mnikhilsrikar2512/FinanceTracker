<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budgets | Finly</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appleBlue: '#007AFF',
            appleGreen: '#34C759',
            appleAmber: '#FF9F0A',
            appleRed: '#FF3B30'
          }
        }
      }
    }
  </script>
  <script src="js/core/utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260406-1">
</head>

<body data-shell="user" class="bg-[#FBFBFD] dark:bg-black transition-colors duration-300">

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">Finly</div>
  <nav class="sidebar-nav" data-sidebar="auto">
    <!-- Links by sidebar.js -->
  </nav>
  
  <div class="mt-auto pt-6 border-t border-gray-200 dark:border-white/10">
    <button onclick="FinanceUtils.logout()" class="sidebar-item w-full border-none cursor-pointer group">
      <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="group-hover:text-red-500">Log Out</span>
    </button>
  </div>
</div>

<div class="main-content">
  <header class="top-nav">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Budgets</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 font-medium mt-1">Track personal category limits and monthly spending progress.</p>
    </div>
    <div class="flex items-center gap-6">
      <span id="pageContextBadge" class="context-chip context-chip-user">Loading view</span>
      <div data-header-tools="default"></div>
    </div>
  </header>

  <main class="mt-8">
    <!-- Quick Create Section (No Overlay) -->
    <div class="apple-card surface-accent-blue mb-10 p-8">
      <div class="flex items-center gap-4 mb-8">
        <div class="w-12 h-12 rounded-2xl accent-icon accent-icon-blue flex items-center justify-center text-xl">
          🎯
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900 dark:text-white">Create New Budget</h3>
          <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">Set a spending limit</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-8 items-end">
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Category</label>
          <select id="budgetCategory" class="apple-input bg-white dark:bg-gray-800 border border-gray-100 dark:border-white/5 font-bold text-sm"></select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Monthly Limit</label>
          <input id="budgetAmount" type="number" placeholder="0.00" class="apple-input bg-white dark:bg-gray-800 border border-gray-100 dark:border-white/5 font-bold text-sm">
        </div>
        <div class="md:col-span-1">
          <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Goal / Note</label>
          <input id="budgetDescription" placeholder="What's the goal?" class="apple-input bg-white dark:bg-gray-800 border border-gray-100 dark:border-white/5 text-sm">
        </div>
        <div>
          <button onclick="saveBudget()" class="btn btn-primary w-full py-3.5">Set Budget</button>
        </div>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
      <div class="apple-card metric-card metric-card-blue border-l-4" style="border-left-color: var(--apple-blue);">
        <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Total Budgeted</p>
        <h2 id="totalBudget" class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">₹0</h2>
      </div>
      <div class="apple-card metric-card metric-card-red border-l-4" style="border-left-color: var(--apple-red);">
        <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Total Spent</p>
        <h2 id="totalSpent" class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">₹0</h2>
      </div>
      <div class="apple-card metric-card metric-card-green border-l-4" style="border-left-color: var(--apple-green);">
        <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2">Remaining</p>
        <h2 id="totalRemaining" class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">₹0</h2>
      </div>
    </div>

    <!-- Budget List -->
    <div id="budgetList" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Budget cards by JS -->
    </div>
  </main>
</div>

<script src="js/layout/sidebar.js"></script>
<script src="js/layout/header-actions.js"></script>
<script src="js/pages/shared-shell.js"></script>
<script src="js/pages/budgets.js?v=20260406-1"></script>

</body>
</html>
