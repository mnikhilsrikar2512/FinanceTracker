<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories | Finly Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            applePeach: '#FF7F50',
            appleBlue: '#007AFF'
          }
        }
      }
    }
  </script>
  <script src="js/core/utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-[#FBFBFD] dark:bg-black admin-theme transition-colors duration-300">

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">Finly Admin</div>
  <nav class="sidebar-nav" data-sidebar="admin">
    <!-- Links by sidebar.js -->
  </nav>
  
  <div class="mt-auto pt-6 border-t border-black/5 dark:border-white/10">
    <button onclick="FinanceUtils.logout()" class="sidebar-item w-full border-none cursor-pointer group">
      <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="group-hover:text-red-500">Log Out</span>
    </button>
  </div>
</div>

<div class="main-content">
  <header class="top-nav">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Categories</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 font-medium mt-1">Manage global classification for all users.</p>
    </div>
    <div class="header-cluster">
      <span class="context-chip context-chip-admin">System Admin</span>
      <div data-header-tools="default"></div>
    </div>
  </header>

  <main class="mt-8 max-w-5xl">
    <!-- Quick Add Bar (No Overlay) -->
    <div class="apple-card surface-accent-orange mb-8 p-6">
      <div class="flex flex-wrap items-center gap-4">
        <div class="w-12 h-12 rounded-2xl accent-icon accent-icon-orange flex items-center justify-center text-xl">
          ✨
        </div>
        <div class="flex-1">
          <h3 class="text-sm font-bold text-gray-900 dark:text-white">Quick Create</h3>
          <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">Add a new global category</p>
        </div>
        <div class="flex flex-wrap gap-3 items-center w-full lg:w-auto">
          <select id="newCatType" class="apple-input w-full sm:w-40 text-sm font-bold cursor-pointer bg-white dark:bg-gray-800 border border-gray-100 dark:border-white/5">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <input id="newCatName" placeholder="Category Name (e.g. Health)" class="apple-input w-full sm:w-80 text-sm bg-white dark:bg-gray-800 border border-gray-100 dark:border-white/5">
          <button id="createCategoryBtn" onclick="addCategory()" class="btn btn-primary px-8 sm:min-w-[10rem]" disabled>Create Category</button>
        </div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="segmented-control mb-6">
      <button onclick="switchTab('income')" id="tab-income" class="segment-button">Income</button>
      <button onclick="switchTab('expense')" id="tab-expense" class="segment-button">Expense</button>
    </div>

    <!-- Category List (Apple Style) -->
    <div class="apple-card p-0 overflow-hidden">
      <div class="table-head px-8 py-4 flex items-center text-[10px] font-black text-gray-400 uppercase tracking-[0.2em]">
        <div class="flex-1">Category Name</div>
        <div class="w-48 text-center">Active Usage</div>
        <div class="w-48 text-right">Actions</div>
      </div>
      <div id="categoryList" class="divide-y divide-gray-50 dark:divide-white/5">
        <!-- Categories by JS -->
      </div>
    </div>

    <!-- Inline Reassign Section (Appears only when deleting) -->
    <div id="reassignSection" class="hidden mt-8 apple-card p-8 border-red-100 dark:border-red-900/50 bg-red-50/30 dark:bg-red-900/10 animate-in fade-in slide-in-from-top-4 duration-300">
      <div class="flex items-start gap-6">
        <div class="w-14 h-14 rounded-2xl bg-red-100 dark:bg-red-900/20 text-red-600 dark:text-red-400 flex items-center justify-center text-2xl">
          ⚠️
        </div>
        <div class="flex-1">
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">Delete Category</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 font-medium mt-1">This category has active transactions. Where should they be reassigned?</p>
          
          <div class="mt-6 flex gap-4 items-end">
            <div class="flex-1">
              <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">New Category</label>
              <select id="reassignSelect" class="apple-input text-sm font-bold cursor-pointer bg-white dark:bg-gray-800"></select>
            </div>
            <div class="flex gap-3">
              <button onclick="cancelDelete()" class="btn btn-secondary px-8">Keep Category</button>
              <button onclick="confirmDelete()" class="btn btn-primary bg-red-600 hover:bg-red-700 shadow-lg shadow-red-500/20 px-8">Confirm & Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/layout/sidebar.js"></script>
<script src="js/layout/header-actions.js"></script>
<script>
const token = localStorage.getItem("token");
if (!token) {
  window.location.href = "login.html";
}

/* 🔷 CHECK ADMIN */
async function checkAdmin() {
  const isAdmin = await FinanceUtils.checkAdmin();
  if (!isAdmin) return;
  loadCategories();
}

/* 🔷 STATE */
let currentTab = "income";
let deleteTarget = null;
let categories = [];
let categoryCreatePending = false;

/* 🔷 LOAD CATEGORIES */
async function loadCategories() {
  const list = document.getElementById("categoryList");
  list.innerHTML = FinanceUtils.createSkeleton(5);
  try {
    const res = await FinanceUtils.fetchWithAuth('/categories?include_stats=true');
    if (!res.success) throw new Error(res.error || 'Failed to load categories');
    categories = res.data.map(c => ({
      id: c.id,
      name: c.name,
      type: c.type,
      usage: c.usage_count
    }));
    syncCreateCategoryButton();
    renderCategories();
  } catch (err) {
    console.error('Load categories error:', err);
    FinanceUtils.showToast('Failed to load categories', 'error');
  }
}

/* 🔷 RENDER */
function renderCategories() {
  const list = document.getElementById("categoryList");
  const filtered = categories.filter(c => c.type === currentTab);
  
  // Update Tabs UI
  const incTab = document.getElementById('tab-income');
  const expTab = document.getElementById('tab-expense');
  if (currentTab === 'income') {
    incTab.className = "segment-button segment-button-active-orange";
    expTab.className = "segment-button";
  } else {
    expTab.className = "segment-button segment-button-active-orange";
    incTab.className = "segment-button";
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="p-16 text-center text-gray-400 font-medium">No ${currentTab} categories found</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="list-row flex items-center px-8 py-6 group">
      <div class="flex-1">
        <p class="font-bold text-gray-900 dark:text-white text-lg">${c.name}</p>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">${c.type} Category</p>
      </div>
      <div class="w-48 text-center">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold ${c.usage > 0 ? 'context-chip-admin' : 'bg-gray-100 dark:bg-white/5 text-gray-400'}">
          ${c.usage} ${c.usage === 1 ? 'entry' : 'entries'}
        </span>
      </div>
      <div class="w-48 text-right">
        <button onclick="initiateDelete(${c.id})" class="action-icon-button action-icon-danger opacity-0 group-hover:opacity-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h14"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

/* 🔷 SWITCH TAB */
function switchTab(type) {
  currentTab = type;
  renderCategories();
  cancelDelete(); // Hide reassign if tab changes
}

/* 🔷 ADD */
async function addCategory() {
  if (categoryCreatePending) return;
  const nameInput = document.getElementById("newCatName");
  const typeSelect = document.getElementById("newCatType");
  const name = nameInput.value.trim();
  const type = typeSelect.value;

  if (!name) {
    FinanceUtils.showToast("Please enter a category name", "warning");
    return;
  }
  try {
    categoryCreatePending = true;
    syncCreateCategoryButton();
    const res = await FinanceUtils.fetchWithAuth('/categories', {
      method: 'POST',
      body: JSON.stringify({ name, type })
    });
    if (!res.success) throw new Error(res.error || 'Failed to add category');
    FinanceUtils.showToast('Category created', 'success');
    nameInput.value = '';
    await loadCategories();
  } catch (err) {
    FinanceUtils.showToast(err.message, 'error');
  } finally {
    categoryCreatePending = false;
    syncCreateCategoryButton();
  }
}

function syncCreateCategoryButton() {
  const button = document.getElementById('createCategoryBtn');
  const name = document.getElementById('newCatName').value.trim();
  const type = document.getElementById('newCatType').value;
  const duplicate = categories.some((c) => c.name.trim().toLowerCase() === name.toLowerCase());
  const disabled = categoryCreatePending || !name || !type || duplicate;
  button.disabled = disabled;
  button.textContent = categoryCreatePending ? 'Creating...' : duplicate ? 'Category Exists' : 'Create Category';
}

/* 🔷 DELETE FLOW (No Overlay) */
function initiateDelete(id) {
  const category = categories.find(c => c.id === id);
  if (!category) return;

  const section = document.getElementById("reassignSection");
  
  if (category.usage === 0) {
    if (confirm(`Delete empty category "${category.name}"?`)) {
      deleteTarget = id;
      confirmDelete();
    }
    return;
  }

  deleteTarget = id;
  const select = document.getElementById("reassignSelect");
  select.innerHTML = categories
    .filter(c => c.id !== id && c.type === currentTab)
    .map(c => `<option value="${c.id}">${c.name}</option>`)
    .join('');
  
  section.classList.remove("hidden");
  section.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelDelete() {
  document.getElementById("reassignSection").classList.add("hidden");
  deleteTarget = null;
}

async function confirmDelete() {
  const newCategoryId = document.getElementById("reassignSelect").value;
  try {
    const endpoint = `/categories/${deleteTarget}` + (newCategoryId ? `?reassign_to=${newCategoryId}` : '');
    const res = await FinanceUtils.fetchWithAuth(endpoint, { method: 'DELETE' });
    if (!res.success) throw new Error(res.error || 'Failed to delete');
    FinanceUtils.showToast('Category removed and transactions reassigned', 'success');
    cancelDelete();
    await loadCategories();
  } catch (err) {
    FinanceUtils.showToast(err.message, 'error');
  }
}

// Initial load
checkAdmin();
syncCreateCategoryButton();

document.getElementById('newCatName').addEventListener('input', syncCreateCategoryButton);
document.getElementById('newCatType').addEventListener('change', syncCreateCategoryButton);
</script>

</body>
</html>
