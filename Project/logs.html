<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications | Finance Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <!-- Utility Script -->
  <script src="js/core/utils.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-[#FBFBFD] dark:bg-black transition-colors duration-300">

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">Finly</div>
  <nav class="sidebar-nav" data-sidebar="user">
    <!-- Links by sidebar.js -->
  </nav>
  
  <div class="mt-auto pt-6 border-t border-gray-200 dark:border-white/10">
    <button onclick="FinanceUtils.logout()" class="sidebar-item w-full border-none cursor-pointer group">
      <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="group-hover:text-red-500">Log Out</span>
    </button>
  </div>
</div>

<div class="main-content">
  <header class="top-nav">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Activity Logs</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 font-medium mt-1 uppercase tracking-widest">Recent Account History</p>
    </div>
    <div class="header-cluster">
      <span class="context-chip context-chip-user">Personal Workspace</span>
      <div data-header-tools="default"></div>
    </div>
  </header>

  <main class="mt-8 max-w-5xl">
    <!-- List View -->
    <div class="apple-card p-0 overflow-hidden">
      <div class="table-head px-8 py-4 flex items-center text-[10px] font-black text-gray-400 uppercase tracking-[0.2em]">
        <div class="flex-1">Activity</div>
        <div class="w-48 text-right">Date & Time</div>
      </div>
      <div id="logsTable" class="divide-y divide-gray-50 dark:divide-white/5">
        <!-- Logs by JS -->
      </div>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between mt-8 px-2">
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest" id="pageInfo">Page 1 of 1</p>
      <div class="flex gap-2">
        <button id="prevBtn" onclick="goToPage('prev')" class="btn btn-secondary px-6 py-2 text-xs" disabled aria-disabled="true">Previous</button>
        <button id="nextBtn" onclick="goToPage('next')" class="btn btn-secondary px-6 py-2 text-xs" disabled aria-disabled="true">Next</button>
      </div>
    </div>
  </main>
</div>

<script src="js/layout/sidebar.js"></script>
<script src="js/layout/header-actions.js"></script>
<script>
const token = localStorage.getItem("token");
if (!token) {
  window.location.href = "login.html";
}

/* 🔷 STATE */
let pagination = {
  limit: 15,
  offset: 0,
  page: 1,
  total_pages: 1,
  has_next: false,
  has_prev: false,
  total: 0
};

/* 🔷 LOAD LOGS */
async function loadLogs() {
  const table = document.getElementById("logsTable");
  table.innerHTML = FinanceUtils.createSkeleton(5);
  try {
    const query = new URLSearchParams({
      limit: pagination.limit,
      offset: pagination.offset
    }).toString();
    const res = await FinanceUtils.fetchWithAuth(`/logs?${query}`);
    if (!res.success) throw new Error(res.error || 'Failed to load logs');
    
    renderLogs(res.data);
    updatePagination(res.meta || {});
  } catch (err) {
    console.error('Load logs error:', err);
    FinanceUtils.showToast('Failed to load activity history', 'error');
    table.innerHTML = FinanceUtils.createStateMarkup({
      title: 'Activity history unavailable',
      message: 'We could not load your account events right now. Please retry shortly.',
      tone: 'error'
    });
  }
}

function updatePagination(meta) {
  pagination = { ...pagination, ...meta };
  document.getElementById('pageInfo').textContent = `Page ${pagination.page} of ${pagination.total_pages} • ${pagination.total} activities`;
  document.getElementById('prevBtn').disabled = !pagination.has_prev;
  document.getElementById('nextBtn').disabled = !pagination.has_next;
  document.getElementById('prevBtn').setAttribute('aria-disabled', String(!pagination.has_prev));
  document.getElementById('nextBtn').setAttribute('aria-disabled', String(!pagination.has_next));
}

function goToPage(direction) {
  if (direction === 'prev' && pagination.has_prev) {
    pagination.offset -= pagination.limit;
    loadLogs();
  } else if (direction === 'next' && pagination.has_next) {
    pagination.offset += pagination.limit;
    loadLogs();
  }
}

/* 🔷 RENDER */
function renderLogs(data) {
  const table = document.getElementById("logsTable");
  table.innerHTML = "";
  if (data.length === 0) {
    table.innerHTML = FinanceUtils.createStateMarkup({
      title: 'No activity recorded yet',
      message: 'Sign-ins and account activity will appear here as you use the app.'
    });
    return;
  }

  data.forEach(l => {
    const date = new Date(l.timestamp || l.created_at).toLocaleString('en-US', { 
      month: 'short', day: 'numeric', year: 'numeric', 
      hour: '2-digit', minute: '2-digit' 
    });
    const actionLabel = l.action_label || l.action || 'Account activity';
    const actionMeta = l.action_description || l.entity_type || 'Account';
    table.innerHTML += `
      <div class="list-row flex flex-col gap-3 px-6 py-6 md:flex-row md:items-center md:px-8 group">
        <div class="flex-1">
          <p class="font-bold text-gray-900 dark:text-white text-base tracking-tight">${actionLabel}</p>
          <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">${actionMeta}</p>
        </div>
        <div class="w-full md:w-48 text-left md:text-right">
          <p class="font-bold text-gray-900 dark:text-white">${date}</p>
        </div>
      </div>
    `;
  });
}

// Init
loadLogs();
</script>

</body>
</html>
