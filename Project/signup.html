<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker | Sign Up</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <!-- Utility Script -->
  <script src="js/core/utils.js?v=20260403-auth-security"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20260402-authfix">
</head>

<body data-page="signup" class="bg-[#FBFBFD] dark:bg-black min-h-screen flex items-center justify-center p-6 transition-colors duration-300">
  <div class="auth-panel">

    <!-- Title -->
    <div class="text-center mb-8">
      <div class="auth-brand-badge mb-6">Finly</div>
      <h2 class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">Create Account</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm font-medium mt-1 uppercase tracking-widest">Join the platform</p>
    </div>

    <!-- Error -->
    <div id="errorBox" class="hidden bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-lg mb-6 text-xs font-bold uppercase tracking-wide border border-red-100 dark:border-red-900/50"></div>

    <!-- Form -->
    <form id="signupForm" class="space-y-5">

      <!-- Name -->
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5 block">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          class="apple-input"
          placeholder="e.g. John Doe"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5 block">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="apple-input"
          placeholder="e.g. name@company.com"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5 block">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="apple-input"
          placeholder="Minimum 8 chars, upper/lower/number"
        />
        <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-2 font-medium">Use at least 8 characters with uppercase, lowercase, and a number.</p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5 block">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          class="apple-input"
          placeholder="••••••••"
        />
      </div>

      <!-- Button -->
      <button
        type="submit"
        id="signupBtn"
        class="btn btn-primary w-full justify-center py-4 uppercase tracking-widest text-xs"
      >
        Create Account
      </button>

    </form>

    <!-- Footer -->
    <p class="text-xs text-gray-500 dark:text-gray-400 text-center mt-10 font-medium">
      Already a member?
      <a href="login.html" class="text-blue-600 dark:text-blue-400 font-black hover:underline uppercase tracking-widest ml-1">Sign In</a>
    </p>

    <p class="text-[11px] text-gray-400 dark:text-gray-500 text-center mt-4 font-medium">
      Need help getting started?
      <a href="support.html" class="text-gray-700 dark:text-gray-200 font-semibold hover:underline ml-1">Open support center</a>
    </p>

  </div>

  <script src="js/pages/auth-pages.js?v=20260406-maint"></script>

</body>
</html>
